# Gradle 构建进程自身的 JVM 参数。
# 本工程只有一个模块、没有 Java 依赖，3g 绰绰有余
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# 本工程没有 Java/Kotlin 源码（AndroidManifest 里 hasCode="false"），
# 也用不到 AndroidX。这一项留着是因为 AGP 在引入任何库依赖时都要求它为 true，
# 现在设好省得以后加依赖时再回来查。
# （实测改成 false 对产物毫无影响，不必为省体积动它）
android.useAndroidX=true

# 资源 ID 不做跨模块传递。单模块工程下没有区别，但这是新工程的默认值
android.nonTransitiveRClass=true

# 关于 APK 体积，记一笔（细节见 app/build.gradle.kts 末尾那段）：
# AGP 9 默认会往运行时类路径里塞一份 kotlin-stdlib（实测 2.2.10，约 2.4MB）。
# 本工程一行 Kotlin 都没有，而 hasCode="false" 又意味着系统根本不会加载 dex，
# 那份 stdlib 是纯死重量，占掉 APK 一半。已在 build.gradle.kts 里排除，
# 排除之后 APK 从 2.0M 降到 1.2M。
#
# 曾经试过 android.builtInKotlin=false，效果相同，但 AGP 提示该选项已弃用、
# AGP 10 会移除，所以改用依赖排除 —— 那个不会过期
